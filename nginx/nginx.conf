# Limita tentativas de login/cadastro por IP
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;

limit_req_zone $binary_remote_addr zone=checkin_zone:10m rate=20r/m;

limit_req_zone $binary_remote_addr zone=feed_zone:10m rate=60r/m;

upstream api_upstream {
    server api:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    location /api/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api_upstream;
    }

    location ~ ^/api/reservations/[^/]+/check-in$ {
        limit_req zone=checkin_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api_upstream;
    }

    # Feed .ics (acesso por token secreto na URL)
    location ~ ^/api/calendar/feed/ {
        limit_req zone=feed_zone burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api_upstream;
    }

    location /api/ {
        proxy_pass http://api_upstream;
    }

    location / {
        return 404;
    }
}
