# Sobe: MongoDB (replica set de 1 nó) + API NestJS + Nginx. O Flutter roda fora dos contêineres.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_KEYFILE: ${MONGO_KEYFILE}
    # Replica set + autenticação exigem keyFile (o arquivo é gerado a partir de MONGO_KEYFILE).
    entrypoint:
      - bash
      - -c
      - |
        echo "$$MONGO_KEYFILE" > /data/keyfile
        chmod 400 /data/keyfile && chown mongodb:mongodb /data/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/keyfile --bind_ip_all
    volumes:
      - mongo_data:/data/db
      - ./mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - ./mongo/rs-healthcheck.js:/rs-healthcheck.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --quiet /rs-healthcheck.js"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [backend]
    # Sem "ports": o banco não é exposto fora da rede interna do Docker.

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=${MONGO_DB}&replicaSet=rs0
      USE_TRANSACTIONS: "true"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      SLOT_MINUTES: ${SLOT_MINUTES:-15}
      LIMIT_MAX_MINUTES_PER_DAY: ${LIMIT_MAX_MINUTES_PER_DAY:-0}
      LIMIT_MAX_ACTIVE_FUTURE: ${LIMIT_MAX_ACTIVE_FUTURE:-0}
      LIMIT_MIN_ADVANCE_MINUTES: ${LIMIT_MIN_ADVANCE_MINUTES:-0}
      LIMIT_MAX_ADVANCE_DAYS: ${LIMIT_MAX_ADVANCE_DAYS:-0}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
    expose:
      - "3000"
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [backend]

networks:
  backend:

volumes:
  mongo_data:
